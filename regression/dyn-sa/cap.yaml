---
cap:
  name: CAP
  restart: cap_restart.yaml

  clock:
    dt: PT1200S
    start: 1891-03-01T00:00:00
    stop: 2999-03-11T00:00:00
    segment_duration: PT1H  # P1DT

  run_extdata: false
  run_history: true
  history_name: History
  root_name: Root

  mapl:

    setServices:
      sharedObj: libMAPL.cap

    children:
      Root:
        dso: libconfigurable_gridcomp
        config_file: root.yaml
      History:
        dso: libMAPL.history
        config_file: history.yaml

  checkpointing:
    enabled: true
    final: true
    path: checkpoints

esmf:
  logKindFlag: ESMF_LOGKIND_MULTI_ON_ERROR
  logAppendFlag: false

mapl:
  model_petcount: 6
