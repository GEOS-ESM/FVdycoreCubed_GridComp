active_collections:
  - test

time_specs:
  three_hour: &one_hour
    frequency: PT1H

collections:
  test:
    template: "%c.nc4"
    time_spec: *one_hour
    var_list:
      "[U,V]": {source: DYNsa.UV}
      "[DUDTANA,DVDTANA]": {source: DYNsa.D_UV_DTANA}
      "[UKE,VKE]": {source: DYNsa.UV_KE}
      "[UPHI,VPHI]": {source: DYNsa.UV_PHI}
      "[UQV,VQV]": {source: DYNsa.UV_QV}

mapl:

  setServices:
    sharedObj: libMAPL.history
      
