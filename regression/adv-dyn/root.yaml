      src_comp: DYN
      dst_comp: ADV

    - src_name: MFY
      dst_name: MFY
      src_comp: DYN
      dst_comp: ADV

    - src_name: CX
      dst_name: CX
      src_comp: DYN
      dst_comp: ADV

    - src_name: CY
      dst_name: CY
      src_comp: DYN
      dst_comp: ADV

    - src_name: PLE0
