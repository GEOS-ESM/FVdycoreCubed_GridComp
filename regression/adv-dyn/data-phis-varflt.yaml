mapl:

  setServices:
    sharedObj: libconfigurable_gridcomp

  states:
    internal:
      PHIS:
        standard_name: "surface_geopotential_height"
        units: "m+2 s-2"
        vertical_dim_spec: "n"
        fill_value: 0.0
      VARFLT:
        standard_name: "variance_of_filtered_topography"
        units: "m+2"
        vertical_dim_spec: "n"
        fill_value: 0.0

  connections:
    - src_comp: <self>
      src_name: PHIS
      src_intent: internal
      dst_comp: <self>
      dst_name: PHIS
      dst_intent: export

    - src_comp: <self>
      src_name: VARFLT
      src_intent: internal
      dst_comp: <self>
      dst_name: VARFLT
      dst_intent: export
